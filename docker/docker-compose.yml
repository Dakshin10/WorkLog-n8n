services:
  postgres:
    image: postgres:16-alpine
    container_name: worklog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: n8n,worklog
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: worklog-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n-main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worklog-n8n-main
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres_secret}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-secret_encryption_key_change_in_prod}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://worklog.example.com/}
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      - NODE_FUNCTION_ALLOW_EXTERNAL=jsonwebtoken,jwks-rsa,uuid,date-fns,date-fns-tz
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_PAYLOAD_SIZE_MAX=16
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_PATH=/usr/local/lib/node_modules
      - APP_ENV=${APP_ENV:-local}
      - APP_ENTRA_TENANT_ID=${APP_ENTRA_TENANT_ID}
      - APP_ENTRA_API_AUDIENCE=${APP_ENTRA_API_AUDIENCE}
      - APP_BOT_APP_ID=${APP_BOT_APP_ID}
      - APP_BOT_TENANT_ID=${APP_BOT_TENANT_ID}
      - APP_WEB_BASE_URL=${APP_WEB_BASE_URL}
      - APP_DEFAULT_TZ=${APP_DEFAULT_TZ:-Asia/Kolkata}
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  n8n-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worklog-n8n-worker-1
    restart: unless-stopped
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres_secret}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-secret_encryption_key_change_in_prod}
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      - NODE_FUNCTION_ALLOW_EXTERNAL=jsonwebtoken,jwks-rsa,uuid,date-fns,date-fns-tz
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_PATH=/usr/local/lib/node_modules
      - APP_ENV=${APP_ENV:-local}
      - APP_ENTRA_TENANT_ID=${APP_ENTRA_TENANT_ID}
      - APP_ENTRA_API_AUDIENCE=${APP_ENTRA_API_AUDIENCE}
      - APP_BOT_APP_ID=${APP_BOT_APP_ID}
      - APP_BOT_TENANT_ID=${APP_BOT_TENANT_ID}
      - APP_WEB_BASE_URL=${APP_WEB_BASE_URL}
      - APP_DEFAULT_TZ=${APP_DEFAULT_TZ:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: worklog-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n-main

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  caddy_data:
  caddy_config:
